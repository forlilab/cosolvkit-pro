# cosolvkit analysis configuration
# Generate a fresh copy with: analyze_cosolvent_simulation --generate-config analysis.yaml
#
# All file paths are resolved relative to this config file's directory,
# so the config is portable across machines and working directories.

# Output directory for all results (per-sim subdirs + merged maps)
out_path: "results"

# -----------------------------------------------------------------
# simulations: list of MD trajectories to analyse jointly.
# Each entry may use a different cosolvent probe (different topology).
# Results are merged at the density-map level before hotspot detection.
# -----------------------------------------------------------------
simulations:
  - trajectory: "sim1/traj.xtc"          # MDAnalysis-readable trajectory
    topology:   "sim1/system.prmtop"      # topology (prmtop, psf, tpr, gro, ...)
    cosolvents: ["BEN", "ACE"]            # residue names of cosolvents in this topology
    label:      "BEN_ACE_probe"           # optional: names the per-sim output subdir
                                          # defaults to sim_0, sim_1, ...

  # Add more simulations to enable multi-probe analysis:
  # - trajectory: "sim2/traj.xtc"
  #   topology:   "sim2/system.prmtop"
  #   cosolvents: ["IPA"]
  #   label:      "IPA_probe"

# -----------------------------------------------------------------
# report: per-simulation structural analysis
# -----------------------------------------------------------------
report:
  rmsf:            true           # compute RMSF and write averaged_trajectory.pdb
  rdf:             false          # compute radial distribution functions (slow)
  rmsf_avg_selec:  "protein"      # MDAnalysis selection averaged into averaged_trajectory.pdb
  align_selection: "protein and name CA"  # selection for RMSD alignment
  reference_pdb:   null           # explicit protein reference for hotspot/binding-site
                                  # visualisation; null → averaged_trajectory.pdb from sim[0]

# -----------------------------------------------------------------
# density_maps: controls AGFE grid generation
# -----------------------------------------------------------------
density_maps:
  use_atomtypes:  true            # split density by pharmacophoric atom type
                                  # (HBD, HBA, Car, Cal, Hal) using SMARTS patterns
  atomtypes_file: null            # path to custom atomtypes JSON; null → built-in default
  gridsize:       0.5             # voxel edge length in Angstroms (also used by hotspots)
  temperature:    300.0           # simulation temperature in Kelvin
  export_raw:     true            # also write map_agfe_raw_*.dx (unclamped AGFE); map_agfe_*.dx
                                  # zeroes voxels >= 0, erasing depletion. ~2x map disk usage.

# -----------------------------------------------------------------
# misc: how per-simulation AGFE maps are combined
# Only relevant when the same cosolvent appears in multiple simulations.
# -----------------------------------------------------------------
misc:
  merge_method:        "mean"     # aggregation: mean | min | max | sum | median
  merge_resampling_to: "first"    # reference grid for resampling when box sizes differ
                                  # first     → use simulations[0]'s grid extents (fastest)
                                  # largest   → use the grid covering the most voxels
                                  # smallest  → use the most conservative (smallest) grid

# -----------------------------------------------------------------
# hotspots: HotspotDetector settings. Must be run after density_maps.
# -----------------------------------------------------------------
hotspots:
  n_kt:           1.0             # AGFE cutoff = -n_kt * kB * T (temperature-aware).
                                  # 1.0 → -1 kT (~ -0.60 kcal/mol at 300 K). Larger = stricter.
  top_percentile: 10.0           # top N% of voxels used for favorability metrics
  survival_kwargs:               # kwargs forwarded to run_survival_probability()
    # By default kinetics is profiled at hotspot CENTROIDS, which are thresholded-and-
    # clustered objects sitting a median 1.4 A from the ligand they represent. Point these
    # at explicit coordinates instead when that matters (see _sp_candidate_zones):
    # zones_csv:      null       # CSV with x,y,z columns -> profile kinetics at THOSE points
    # zone_match_ang: 4.0        # supplied zone -> nearest hotspot within this distance, for
    #                            # attaching sp_* values; unmatched zones attach to no site
    sp_top_n:      5             # per cosolvent: how many top hotspots get SP analysis
                                  # (0 disables survival probability entirely)
    radius:        6.0           # sphere radius around hotspot centroid (Angstroms)
    max_tau:       100           # maximum lag, in FRAMES (100 frames = 10 ns at
                                 # 100 ps/frame). Reported sp_* times are in ps.
    intermittency: 0             # absent FRAMES bridged as continuous occupancy.
                                 # At 100 ps/frame even 1 lets a probe diffuse
                                 # ~7.7 A, beyond the 6 A zone; raise above 0 only
                                 # when frames are written every 1-2 ps.
  clustering:
    strategy:            "skimage_watershed"  # skimage_watershed | connected_components
    strategy_kwargs:     {}       # extra kwargs for the chosen strategy
                                  # e.g. skimage_watershed: {h: 0.5, watershed_mode: score}
                                  #      connected_components: {connectivity: 6}
    min_cluster_volume_ang3: 20.0 # discard clusters below this volume. In A^3, so it is
                                  # invariant to gridsize; 20 A^3 = one heavy atom, and the
                                  # largest value that still recovers every FosAKP pocket.
    # Drop implausibly convex / diffuse hotspots BEFORE binding-site grouping. Off by
    # default. Measured on FosAKP: max_solidity 0.910 cuts 13% of spurious hotspots and
    # keeps all 6 pockets; 0.851 cuts 47% but is one step from losing one. Needs
    # regionprops for solidity. min_field_sharpness is available but bought nothing there.
    max_solidity:        null    # keep hotspots with geom_solidity <= this
    min_field_sharpness: null    # keep hotspots with field_sharpness >= this
    use_skimage_cleanup: false    # apply scikit-image morphology cleanup before clustering
    cleanup_min_size:    1        # remove objects smaller than this (voxels)
    cleanup_hole_size:   2        # fill holes smaller than this (voxels)

# -----------------------------------------------------------------
# binding_sites: cross-cosolvent binding-site detection.
# Groups per-cosolvent hotspots that spatially overlap (voxel
# connectivity) into ranked binding sites.
# -----------------------------------------------------------------
binding_sites:
  enabled:      true              # set to false to skip binding-site detection
  connectivity: 26                # voxel connectivity for grouping: 6, 18, or 26
  merge_tolerance_ang: 2.0        # surface gap (A) that still merges two hotspots
  weights:      null              # null → default binding-site scoring weights
  # Chemotype classes per probe resname, overriding the built-in table in
  # cosolvkit/analysis/core/chemotypes.py. Only needed for probes missing from it, or
  # to reclassify one. Feeds the probe_chemotype_coverage score feature, which counts
  # CHEMICAL CLASSES of probes at a site (unlike probe_coverage, which counts probes).
  # Valid classes: aromatic, aliphatic, hbond_donor, hbond_acceptor, anionic, cationic.
  probe_chemotypes: null          # e.g. {MYP: [aromatic, anionic]}

# -----------------------------------------------------------------
# checkpoint: save/load hotspot results to skip re-detection
# -----------------------------------------------------------------
checkpoint:
  save_hotspots: true             # write hotspot_checkpoints/{cosolvent}.npz after detection
  load_hotspots: false            # skip hotspot detection and reload from checkpoint instead

# -----------------------------------------------------------------
# pymol: binding-site PyMol session generation
# -----------------------------------------------------------------
pymol:
  enabled:     true               # generate binding_sites_session.pse
  top_n_sites: 0                  # 0 = all sites; otherwise the top-N by rank
