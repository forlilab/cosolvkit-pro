# cosolvkit analysis configuration — example 03
#
# Chains off examples 01 (build) and 02 (equilibration + production). It reads the
# aligned production trajectory from example 02 and the topology (system.pdb) from
# example 01, builds AGFE density maps, and detects hotspots for the benzene +
# imidazole probes.
#
# All file paths are resolved relative to THIS config file's directory.
# Regenerate the full, fully-commented template with:
#   analyze_cosolvent_simulation --generate-config analysis.yaml

# Output directory for all results (per-sim subdirs + merged maps).
out_path: "results"

# -----------------------------------------------------------------
# simulations: MD trajectories to analyse jointly (benzene + imidazole replicas).
# -----------------------------------------------------------------
simulations:
  - trajectory: "../02_equilibration-and-production/6E22_benzene/MD/MD_6E22_benzene_rep1_aligned.dcd"
    topology:   "../01_build_cosolvent_system/6E22_benzene/system.pdb"
    cosolvents: ["BEN"]            # benzene residue name
    label:      "benzene_rep1"     # names the per-sim output subdir

  - trajectory: "../02_equilibration-and-production/6E22_imidazole/MD/MD_6E22_imidazole_rep1_aligned.dcd"
    topology:   "../01_build_cosolvent_system/6E22_imidazole/system.pdb"
    cosolvents: ["IMI"]            # imidazole residue name
    label:      "imidazole_rep1"   # names the per-sim output subdir

# -----------------------------------------------------------------
# report: per-simulation structural analysis
# -----------------------------------------------------------------
report:
  rmsf:            true            # writes averaged_trajectory.pdb (the hotspot reference)
  rdf:             false
  rmsf_avg_selec:  "protein"
  align_selection: "protein and name CA"
  reference_pdb:   ../01_build_cosolvent_system/6E22.pdb  # explicit protein reference

# -----------------------------------------------------------------
# density_maps: AGFE grid generation
# -----------------------------------------------------------------
density_maps:
  use_atomtypes:  false           # split density by pharmacophoric atom type (HBD/HBA/Car/...)
  atomtypes_file: null            # null → built-in defaults
  gridsize:       0.5             # voxel edge (Angstrom); also used by hotspots
  temperature:    300.0           # Kelvin (match the production run)

# -----------------------------------------------------------------
# misc: how per-simulation maps combine (only matters with >1 simulation)
# -----------------------------------------------------------------
misc:
  merge_method:        "mean"
  merge_resampling_to: "smallest"

# -----------------------------------------------------------------
# hotspots: HotspotDetector settings
# -----------------------------------------------------------------
hotspots:
  n_kt:           1.0             # AGFE cutoff = -1 kT (~ -0.60 kcal/mol at 300 K)
  top_percentile: 10.0
  survival_kwargs:
    sp_top_n:      10              # 0 = disable survival probability for this example
    radius:        6.0
    max_tau:       100
    intermittency: 0   # FRAMES bridged as continuous occupancy. At 100 ps/frame even
                       # 1 lets a probe diffuse ~7.7 A > the 6 A zone; use >0 only if
                       # frames are written every 1-2 ps.
  clustering:
    strategy:            "skimage_watershed"
    strategy_kwargs:     {}
    # Grid-independent size floor. 20 A^3 = one heavy atom's vdW volume, and the largest value
    # that still recovers every ground-truth site on FosAKP (see ClusteringConfig).
    min_cluster_volume_ang3: 20.0
    use_skimage_cleanup: true
    cleanup_min_size:    1
    cleanup_hole_size:   2

# -----------------------------------------------------------------
# binding_sites: connected-component grouping of hotspots into sites
# (most useful with >= 2 probes).
# -----------------------------------------------------------------
binding_sites:
  enabled:      true
  connectivity: 6       # 6 (face-sharing) or 26 (also diagonal-touching voxels)
  merge_tolerance_ang: 0.0   # max surface gap (A) that still merges two hotspots.
                             # >0 fused distinct pockets on FosAKP: recovery 6/7 ->
                             # 4/7 and one site claimed 3 pockets. See BindingSitesConfig.
  weights:      null    # null → default binding-site weights. 

# -----------------------------------------------------------------
# checkpoint: save hotspot results so binding-site detection can be
# re-run without redoing hotspot detection.
# -----------------------------------------------------------------
checkpoint:
  save_hotspots: true
  load_hotspots: false

# -----------------------------------------------------------------
# pymol: binding-site PyMol session generation
# -----------------------------------------------------------------
pymol:
  enabled:     true
  top_n_sites: 5
